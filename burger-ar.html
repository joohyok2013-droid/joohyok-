<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR 햄버거집</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;justify-content:center}
#w{position:relative;width:100%;max-width:960px}
canvas{width:100%;display:block;background:#222}
video{display:none}
#m{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#m.off{display:none}
button{background:#e8590c;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
button.alt{background:#555}
</style>
</head>
<body>
<div id="w">
<canvas id="c" width="960" height="720"></canvas>
<video id="v" playsinline muted></video>
<div id="m"><div id="t">🍔 AR 햄버거집<br>엄지와 검지를 모아(핀치) 재료를 집고,<br>접시 위에서 손가락을 펴서 놓으세요!</div>
<button id="b1">📷 카메라 켜고 시작</button><button id="b2" class="alt">🖱 마우스로 해보기</button></div>
</div>
<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),v=$('v'),W=960,H=720;
const ING=[{e:'🥩',n:'패티'},{e:'🧀',n:'치즈'},{e:'🥬',n:'양상추'},{e:'🍅',n:'토마토'},{e:'🍞',n:'윗빵'}];
const IX=90,IY=i=>130+i*120,R=48,PX=560,PY=600;
let lm=null,cam=false,run=false,over=false,score=0,time=60,order=[],step=0,held=-1,was=false,fb='',fbT=0,tmr=null,lastT=-1;
let hands=[],mouse={x:0,y:0,pinch:false,on:false};
function newOrder(){const n=2+Math.floor(Math.random()*3);order=[];for(let i=0;i<n;i++)order.push(Math.floor(Math.random()*4));order.push(4);step=0}
function say(s){fb=s;fbT=performance.now()+800}
function place(i){
 if(i===order[step]){step++;say('좋아요! 👍');if(step>=order.length){score+=10+order.length*2;time=Math.min(time+3,99);newOrder()}}
 else{time=Math.max(0,time-2);say('순서가 달라요! ❌')}
}
function start(){score=0;time=60;run=true;over=false;held=-1;newOrder();$('m').classList.add('off');clearInterval(tmr);
 tmr=setInterval(()=>{if(--time<=0){time=0;run=false;clearInterval(tmr);$('t').innerHTML='게임 끝! 🍔<br>점수: <b>'+score+'</b>';$('b2').style.display='none';$('b1').textContent='🔁 다시 하기';$('m').classList.remove('off')}},1000)}
$('b2').onclick=()=>{cam=false;mouse.on=true;start()};
$('b1').onclick=async()=>{
 if($('b2').style.display==='none'){start();return}
 $('t').textContent='손 인식 모델을 불러오는 중...';
 try{
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  lm=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},runningMode:"VIDEO",numHands:2});
  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
  await v.play();cam=true;start();
 }catch(e){$('t').innerHTML='카메라/손 인식을 시작하지 못했어요 😢<br>'+e.message}
};
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H});
cv.addEventListener('pointerdown',()=>mouse.pinch=true);
addEventListener('pointerup',()=>mouse.pinch=false);
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function track(){
 if(!(cam&&lm&&v.readyState>=2&&v.currentTime!==lastT))return;
 lastT=v.currentTime;
 const r=lm.detectForVideo(v,performance.now());
 hands=r.landmarks.map(l=>{
  const pts=l.map(p=>({x:(1-p.x)*W,y:p.y*H}));
  const mid={x:(pts[4].x+pts[8].x)/2,y:(pts[4].y+pts[8].y)/2};
  return {pts,x:mid.x,y:mid.y,pinch:d(pts[4],pts[8])/d(pts[0],pts[9])<0.4};
 });
}
function pointer(){
 if(cam&&hands.length)return hands.find(h=>h.pinch)||hands[0];
 if(mouse.on)return mouse;
 return null;
}
function logic(p){
 if(!run||!p){if(held>=0&&run){held=-1}was=false;return}
 if(p.pinch&&!was&&held<0){for(let i=0;i<5;i++)if(Math.hypot(p.x-IX,p.y-IY(i))<R+25){held=i;break}}
 if(!p.pinch&&held>=0){if(p.x>PX-180&&p.x<PX+180&&p.y>380)place(held);held=-1}
 was=p.pinch;
}
function draw(p){
 g.clearRect(0,0,W,H);
 if(cam){g.save();g.scale(-1,1);g.drawImage(v,-W,0,W,H);g.restore();g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,W,H)}
 else{g.fillStyle='#3b2a1c';g.fillRect(0,0,W,H)}
 g.textAlign='center';g.textBaseline='middle';
 for(let i=0;i<5;i++){
  g.fillStyle=held===i?'rgba(255,200,60,.8)':'rgba(255,255,255,.75)';
  g.beginPath();g.arc(IX,IY(i),R,0,7);g.fill();
  g.font='46px serif';g.fillStyle='#000';g.fillText(ING[i].e,IX,IY(i)+2);
  g.font='14px sans-serif';g.fillStyle='#fff';g.fillText(ING[i].n,IX+R+34,IY(i));
 }
 g.fillStyle='rgba(255,255,255,.8)';g.beginPath();g.ellipse(PX,PY+30,170,28,0,0,7);g.fill();
 const mine=[4,...order.slice(0,step)].reverse();
 g.font='56px serif';
 mine.reverse().forEach((o,k)=>g.fillText(k===0?'🍞':ING[o].e,PX,PY-k*34));
 g.fillStyle='rgba(0,0,0,.6)';g.fillRect(W-210,20,190,60+order.length*44);
 g.fillStyle='#fff';g.font='bold 16px sans-serif';g.fillText('주문서 (아래→위)',W-115,42);
 g.font='34px serif';
 order.forEach((o,k)=>{g.globalAlpha=k<step?.3:1;g.fillText(ING[o].e,W-115,80+k*44)});
 g.globalAlpha=1;
 g.font='bold 24px sans-serif';g.textAlign='left';g.fillStyle='#fff';
 g.fillText('점수 '+score+'   ⏱ '+time,20,36);
 g.textAlign='center';
 if(performance.now()<fbT){g.font='bold 44px sans-serif';g.fillStyle='#ffd43b';g.fillText(fb,W/2,90)}
 if(cam)for(const h of hands){g.fillStyle='rgba(255,255,255,.8)';h.pts.forEach(q=>{g.beginPath();g.arc(q.x,q.y,4,0,7);g.fill()})}
 if(p){
  g.strokeStyle=p.pinch?'#51cf66':'#fff';g.lineWidth=5;g.beginPath();g.arc(p.x,p.y,p.pinch?16:28,0,7);g.stroke();
  if(held>=0){g.font='60px serif';g.fillText(ING[held].e,p.x,p.y)}
 }
}
function loop(){requestAnimationFrame(loop);track();const p=pointer();logic(p);draw(p)}
loop();
</script>
</body>
</html>
